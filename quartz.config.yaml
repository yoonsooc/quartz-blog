# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# YSC's Garden — Quartz 5 설정 (v4 quartz.config.ts + quartz.layout.ts에서 이전)
configuration:
  pageTitle: YSC's Garden
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # 방문 분석을 쓰지 않는다. Quartz 기본값(plausible)은 계정이 없어도 모든 페이지에서
  # plausible.io로 방문 기록을 보낸다.
  analytics: null
  locale: en-US
  baseUrl: yoonsooc.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/*.base"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e8e8e8"
        gray: "#b0b0b0"
        darkgray: "#3a3a3a"
        dark: "#1a1a1a"
        secondary: "#d62839"
        tertiary: "#2185d0"
        highlight: rgba(214, 40, 57, 0.08)
        textHighlight: "#ffe06688"
      darkMode:
        light: "#0e0e0e"
        lightgray: "#1e1e1e"
        gray: "#555555"
        darkgray: "#d0d0d0"
        dark: "#f0f0f0"
        secondary: "#ff3b4e"
        tertiary: "#4da8ff"
        highlight: rgba(255, 59, 78, 0.12)
        textHighlight: "#ffe06688"
# 게시 대상 수집 규칙 (scripts/sync-content.mjs가 읽는다).
# 볼트 전체에서 publish: true인 노트와 그 노트가 참조하는 첨부만 모아 content를 만든다.
#   routes   볼트 경로(from) → 사이트 경로(to). 위에서부터 처음 맞는 규칙을 쓴다.
#            flatten: true면 볼트의 폴더 구조를 버리고 파일 이름만 쓴다
#            (예: "200. Area/x/메모.md" → /thoughts/메모). 내부 폴더 이름이 주소에
#            드러나지 않고, 섹션 인덱스의 전체 목록에 모든 노트가 한 번에 나온다
#            (folder-page는 하위 폴더 안의 노트를 상위 목록에 싣지 않는다).
#   exclude  publish: true가 있어도 게시하지 않는 볼트 폴더
_publish:
  exclude: [templates]
  attachments: attachments
  routes:
    - { from: "_blog/daily", to: daily }
    - { from: "_blog", to: posts, flatten: true }
    - { from: "", to: thoughts, flatten: true }
# 섹션 정의 단일 소스 (앵커로 각 플러그인 options에 공유)
# 비공개 섹션의 key/prefix는 볼트 폴더 이름(_blog/daily)과 URL이라 그대로 두고
# 표시 이름(label)만 Private로 쓴다. 폴더를 private로 바꾸면 ignorePatterns의
# "private"에 걸려 빌드에서 통째로 빠진다.
#
# nav: 왼쪽 내비게이션에 "최근 글" 묶음으로 내놓는다(section-nav 플러그인).
#   title  묶음 제목
#   limit  보여 줄 최근 노트 수. 넘치면 "See N more →"로 섹션 인덱스에 연결한다.
#   전체 목록은 섹션 인덱스(/posts, /thoughts)에서 folder-page가 그린다.
# categories: 섹션 인덱스 본문에 넣는 분류별 디렉토리. 정의하면 그 섹션의 페이지에서는
#   왼쪽 내비게이션이 최근 글 대신 분류 이름을 보여 준다. 지금은 Private만 쓴다.
#   all      섹션의 모든 노트
#   tag      노트 frontmatter의 tags에 이 값이 있으면 해당 분류에 넣는다
#   default  어느 태그 분류에도 들지 않은 노트가 들어가는 분류
#   fromTags 노트에 쓰인 태그마다 분류를 자동으로 하나씩 만든다. 분류 이름은 암호화
#            영역 밖에 평문으로 나오므로 비공개 섹션에는 쓰지 않는다.
#   urlEnv   노트 목록 대신 외부 페이지를 보여 주는 분류. 주소는 저장소에 남지 않게
#            환경변수(.env)에서 읽고, 값이 없으면 분류 자체를 숨긴다.
# groupByFolder(섹션 옵션): 분류 안에서 하위 폴더별 소제목으로 한 번 더 묶는다.
# hideTab(섹션 옵션): 상단 탭에 내놓지 않는다. 주소(/daily)를 직접 입력해 들어간다.
#
# Posts는 완성된 형태의 글(볼트의 _blog)이고, Thoughts는 그 외 폴더의 노트 중
# publish: true를 붙인 것(아직 다듬는 중인 메모)이다.
_sections: &sections
  - key: posts
    label: All Posts
    prefix: posts
    nav: { title: Writings, limit: 4 }
  - key: thoughts
    label: Notes
    prefix: thoughts
    nav: { title: Notes, limit: 4 }
  - key: daily
    label: Private
    prefix: daily
    private: true
    hideTab: true
    groupByFolder: true
    categories:
      # Daily: 노션으로 옮긴 일일 기록·할 일 뷰. 맨 앞 분류가 기본으로 열린다.
      - { key: daily, label: Daily, urlEnv: SITE_PRIVATE_NOTION_URL }
      - { key: apply, label: Apply, tag: apply }
      - { key: archived, label: Archived, default: true }
plugins:
  # ---------- local plugins ----------
  - source: "./plugins/section-privacy"
    enabled: true
    options:
      sections: *sections
      passwordField: password
    order: 890
  # Obsidian 동적 조회(Bases 임베드, dataviewjs, Dataview 인라인 식)를 빌드 타임에
  # 정적 마크다운으로 굳힌다. 볼트 루트에서 직접 읽으므로 조회 대상 노트는
  # 비게시(content 밖)여도 된다. 위키링크·임베드 처리(order 30)보다 먼저 실행되어야 한다.
  - source: "./plugins/vault-query"
    enabled: true
    options:
      sections: *sections
      publicPages: warn
    order: 3
  # 섹션 탭. 섹션은 왼쪽 내비게이션(section-nav)으로 드러내므로 꺼 두었다.
  - source: "./plugins/section-tabs"
    enabled: false
    options:
      sections: *sections
    layout:
      position: left
      priority: 10
  # 변환기(디렉토리 주입)는 section-privacy(890)·encrypted-pages(900)보다 앞에 둔다
  - source: "./plugins/section-nav"
    enabled: true
    options:
      sections: *sections
    order: 880
    layout:
      position: left
      priority: 40
  - source: "./plugins/hero"
    enabled: true
    options:
      subtitle: "notes on engineering, and thoughts"
      sections: *sections
      home: posts
    layout:
      position: left
      priority: 1
  # ---------- transformers ----------
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark-dimmed
      keepBackground: true
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # 게시되지 않은 노트로 가는 위키링크에 표식을 붙인다. 표식이 붙은 링크는 바로
      # 아래의 unpublished-links가 일반 텍스트로 바꾼다.
      disableBrokenWikilinks: true
    order: 60
  - source: "./plugins/unpublished-links"
    enabled: true
    order: 65
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  # 옵시디언처럼 문단 안의 줄바꿈 한 번을 실제 줄바꿈(<br>)으로 렌더링한다.
  # 표준 마크다운은 줄바꿈 한 번을 공백으로 취급한다.
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  # ---------- filters ----------
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  # ---------- emitters / misc ----------
  - source: "@quartz-community/alias-redirects"
    enabled: true
  # 첫 화면(/)은 /posts로 보낸다
  - source: "./plugins/root-redirect"
    enabled: true
    options:
      to: posts
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  # 비공개 섹션 인덱스는 folder-page가 그린다. 하위 폴더 목록은 암호화 영역 밖에
  # 평문으로 나오고(월 폴더 이름 노출) 링크도 404라서 끈다. 목록은 section-privacy가
  # 암호화 영역 안에 분류별로 넣는다.
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      # 제목 아래의 "N items under this folder." 한 줄. 항목이 없는 목록(비공개 섹션)
      # 에서는 custom.scss가 목록 영역을 통째로 숨긴다.
      showFolderCount: true
      showSubfolders: false
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  # ---------- privacy: 비공개 섹션 ----------
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: true
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  # ---------- layout components (v4 레이아웃 재현: 미니멀) ----------
  - source: "@quartz-community/explorer"
    enabled: false
  - source: "@quartz-community/graph"
    enabled: false
  # 이 노트를 링크한 다른 노트 목록. 목록에서 제외된(비공개) 노트는 나오지 않는다.
  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/breadcrumbs"
    enabled: false
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: "@quartz-community/stacked-pages"
    enabled: false
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: not-index
  # 글만 고르지 않고 목록에 실릴 수 있는 모든 페이지(첫 화면, 404, 태그 인덱스)를
  # 나열하고, 이를 뺄 옵션이 없어서 껐다. 글 목록은 section-nav의 분류가 맡는다.
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: ""
      limit: 100
      showTags: true
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: {}
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
